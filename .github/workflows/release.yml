name: Release

# Tags a release and publishes it to GitHub and Nebula (the public SCPUI mod).
#
# The version comes from `local version = "..."` in content/data/scripts/scpui_system_core.lua on
# the source ref. Bump it and get it onto master first; this workflow never pushes a commit, only
# the tag.
#
#   1.2.0      ->  tag v.1.2.0-release      GitHub release, Nebula stability "stable"
#   1.2.0-RC1  ->  tag v.1.2.0-RC1-release  GitHub prerelease, Nebula stability "rc"
#
# The GitHub release is created as a draft with the download zip attached; write the notes and
# publish it by hand. Nebula uploads are private unless the NEBULA_PRIVATE repo variable is 'false'.
#
# If the tag and GitHub release succeeded but the Nebula publish failed, re-run with nebula_only.
# The version is still read from source_ref, so if master has been bumped since, pass the tag.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or commit to release from
        type: string
        default: master
      dry_run:
        description: Only report the version and tag; don't tag, release or publish
        type: boolean
        default: true
      nebula_only:
        description: Retry just the Nebula publish for a release whose tag already exists
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0    # all tags, for the existing/newer checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Work out version and tag
        id: version
        run: python .github/scripts/scpui_publish.py version --mode release ${{ inputs.nebula_only && '--resume' || '' }}

      - name: Check out the release tag
        # Build exactly what was tagged, even if the source ref has moved on since
        if: inputs.nebula_only
        run: git checkout "${{ steps.version.outputs.tag }}"

      - name: Stop here for a dry run
        if: inputs.dry_run
        run: |
          echo "Dry run: would release ${{ steps.version.outputs.mod_id }} ${{ steps.version.outputs.version }}" \
               "as ${{ steps.version.outputs.tag }} from $(git log -1 --format='%h %s')."

      - name: Build packages
        if: ${{ !inputs.dry_run }}
        run: |
          python .github/scripts/scpui_publish.py build --mode release \
            --version "${{ steps.version.outputs.version }}" \
            --stability "${{ steps.version.outputs.prerelease == 'true' && 'rc' || 'stable' }}" \
            --private "${{ vars.NEBULA_PRIVATE }}" \
            --zip "SCPUI-${{ steps.version.outputs.version }}.zip"

      - name: Tag and create draft GitHub release
        if: ${{ !inputs.dry_run && !inputs.nebula_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release v.$VERSION"
          git push origin "refs/tags/$TAG"

          flags=(--draft --verify-tag --title "v.$VERSION Release" --notes "")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "dist/SCPUI-$VERSION.zip" "${flags[@]}"

      - name: Publish to Nebula
        if: ${{ !inputs.dry_run }}
        env:
          NEBULA_USER: ${{ secrets.NEBULA_USER }}
          NEBULA_PASSWORD: ${{ secrets.NEBULA_PASSWORD }}
        run: python .github/scripts/scpui_publish.py publish
